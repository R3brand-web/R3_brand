<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>R³ Brand | Elegance</title>
  <style>
    body { background-color: #000; color: #fff; font-family: Arial, sans-serif; margin: 0; text-align: center; }
    header { padding: 40px 20px; }
    .logo-img { width: 150px; border-radius: 10px; margin-bottom: 10px; }
    nav { background: #111; padding: 15px; border-bottom: 1px solid #333; position: sticky; top: 0; z-index: 100; }
    nav a { color: #fff; text-decoration: none; margin: 0 15px; font-size: 14px; }
    .hero { padding: 60px 20px; background: #050505; }
    .hero button { background: #d4a373; border: none; padding: 10px 30px; cursor: pointer; font-weight: bold; border-radius: 5px; }
    .products { display: flex; justify-content: center; gap: 20px; padding: 40px; flex-wrap: wrap; }
    .card { background: #111; border: 1px solid #222; width: 280px; padding-bottom: 20px; border-radius: 10px; overflow: hidden; }
    .card img { width: 100%; height: 380px; object-fit: cover; }
    .whatsapp { color: #25d366; text-decoration: none; font-weight: bold; border: 1px solid #25d366; padding: 10px 20px; display: inline-block; margin-top: 20px; border-radius: 5px; }
    footer { padding: 20px; border-top: 1px solid #222; color: #555; margin-top: 40px; }
  </style>
</head>
<body>

<header>
  <img src="1000341951.png" alt="R3 Logo" class="logo-img">
  <h1>R³</h1>
  <p>Less basic, more unique ✨️🌻</p>
</header>

<nav>
  <a href="#home">الرئيسية</a>
  <a href="#shop">المنتجات</a>
  <a href="#contact">تواصل معنا</a>
</nav>

<section id="home" class="hero">
  <h2>ستايلك… قوّتك</h2>
  <button onclick="window.location.href='https://wa.me/201018309689'">تسوّقي الآن</button>
</section>

<section id="shop">
  <h2 style="margin-top:40px;">أحدث المنتجات</h2>
  <div class="products">
    <div class="card">
        <img src="1000355000.jpg" alt="الهودي الترند">
        <h3 style="color: #d4a373; margin-top:15px;">الهودي الترند</h3>
        <p>Online clothing brand in Egypt 🇪🇬</p>
    </div>
    <div class="card">
        <div style="height:380px; background:#222; display:flex; align-items:center; justify-content:center; color:#555;">قريباً</div>
        <h3>Coming Soon</h3>
    </div>
  </div>
</section>

<section id="contact" style="padding: 40px;">
  <h2>تواصل معنا</h2>
  <a class="whatsapp" href="https://wa.me/201018309689">اطلبي عبر واتساب</a>
  <br><br>
  <a href="https://www.facebook.com/profile.php?id=61584700993226" target="_blank" style="color:#1877f2; text-decoration:none;">تابعونا على فيسبوك</a>
</section>

<footer>
  <p>© R³ Brand 2025 | Delivery 2–7 days</p>
</footer>

</body>
</html>
